<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2f6feb" />
    <!-- The theme is settled before the first paint, from the stored choice or the system, so a dark
         preference never flashes light on the way in. `lib/theme.svelte.ts` takes over from here. -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("atelier-cloud:theme");
          const dark = stored
            ? stored === "dark"
            : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (dark) {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#282828");
          }
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <!-- Who publishes the app and which origin is canonical. It lives in the template so every
         generated page, including the client-rendered shell, carries it. Change the host here if the
         deployment moves. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://ateliercloud.tech/#organization",
            "name": "Atelier Cloud",
            "url": "https://ateliercloud.tech/"
          },
          {
            "@type": "WebSite",
            "@id": "https://ateliercloud.tech/#website",
            "name": "Atelier Cloud",
            "url": "https://ateliercloud.tech/cloud/",
            "inLanguage": "en",
            "publisher": { "@id": "https://ateliercloud.tech/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://ateliercloud.tech/cloud/#app",
            "name": "Atelier Cloud",
            "url": "https://ateliercloud.tech/cloud/",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Any",
            "browserRequirements": "The Origin Private File System and WebAssembly",
            "description": "A photo editor in the browser with a project library: open PSD, PSB and .pcraft documents, record revisions, and copy a document to your own S3-compatible bucket.",
            "publisher": { "@id": "https://ateliercloud.tech/#organization" },
            "featureList": [
              "Open PSD, PSB and .pcraft documents in PhotoCraft",
              "One workspace per project, kept in the browser",
              "Revisions, with a diff against the last recorded version",
              "Copy a document to your own S3-compatible bucket"
            ]
          }
        ]
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
