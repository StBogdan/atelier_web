<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2f6feb" />
    <!-- The theme is settled before the first paint, from the stored choice or the system, so a dark
         preference never flashes light on the way in. `lib/theme.svelte.ts` takes over from here. -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("atelier-cloud:theme");
          const dark = stored
            ? stored === "dark"
            : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (dark) {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#282828");
          }
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <!-- Who publishes the app and which origin is canonical. It lives in the template so every
         generated page, including the client-rendered shell, carries it. The landing page under
         static/landing carries the same graph, and `lib/site.ts` names the origin for the canonical
         links. Change the host in all three if the deployment moves. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://ateliercloud.tech/#organization",
            "name": "Atelier Cloud",
            "url": "https://ateliercloud.tech/",
            "logo": "https://ateliercloud.tech/landing/logo-1024.png",
            "sameAs": ["https://github.com/StBogdan/atelier_web"]
          },
          {
            "@type": "WebSite",
            "@id": "https://ateliercloud.tech/#website",
            "name": "Atelier Cloud",
            "url": "https://ateliercloud.tech/",
            "inLanguage": "en",
            "publisher": { "@id": "https://ateliercloud.tech/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://ateliercloud.tech/#app",
            "name": "Atelier Cloud",
            "alternateName": ["PhotoCraft online", "Hosted PhotoCraft"],
            "url": "https://ateliercloud.tech/workspaces/",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Any",
            "browserRequirements": "The Origin Private File System and WebAssembly",
            "description": "A hosted PhotoCraft and PdfCraft in the browser: open PSD, PSB and .pcraft documents, work on PDFs in PdfCraft, keep each project in a browser workspace, and send a document to your own S3-compatible bucket. Free while in alpha, with no account.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "screenshot": "https://ateliercloud.tech/landing/workspaces.png",
            "featureList": [
              "Open PSD, PSB and .pcraft documents in PhotoCraft",
              "Read, organise, combine and split PDFs in PdfCraft",
              "One workspace per project, kept in the browser",
              "A version recorded every time you save",
              "Send a document to your own S3-compatible bucket",
              "No install, no account, free while in alpha"
            ],
            "publisher": { "@id": "https://ateliercloud.tech/#organization" }
          }
        ]
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
